<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>qala — Create Account</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Inter",sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(140deg,#07152c,#0b1e3d,#030b18);
color:white;
overflow:hidden;
}

/* animated grid background */

body:before{
content:"";
position:absolute;
width:200%;
height:200%;

background-image:
linear-gradient(rgba(244,239,230,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(244,239,230,0.05) 1px, transparent 1px);

background-size:70px 70px;
animation:gridmove 25s linear infinite;
}

@keyframes gridmove{
0%{transform:translate(0,0)}
100%{transform:translate(-70px,-70px)}
}

.container{

width:1100px;
height:650px;
display:flex;

background:rgba(255,255,255,0.03);
border-radius:20px;

backdrop-filter:blur(20px);

box-shadow:0 40px 120px rgba(0,0,0,0.7);

overflow:hidden;
z-index:2;

border:1px solid rgba(244,239,230,0.08);

}

/* left panel */

.left{

flex:1.2;
padding:70px;

display:flex;
flex-direction:column;
justify-content:center;

background:linear-gradient(160deg,#0b1e3d,#050f22);

}

.logo{

font-size:44px;
font-weight:700;
letter-spacing:2px;
color:#faf6ee;

margin-bottom:12px;

}

.tagline{

font-size:15px;
color:#b7c3d6;
margin-bottom:40px;

}

.info{

font-size:14px;
line-height:30px;
color:#dbe3f3;

}

.info div{

padding-left:10px;
border-left:3px solid rgba(244,239,230,0.3);
margin-bottom:10px;

}

/* right panel */

.right{

flex:1;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.02);

}

.register-box{

width:380px;

}

.register-title{

font-size:24px;
font-weight:600;
margin-bottom:25px;

color:#faf6ee;

}

/* form */

input{

width:100%;
padding:14px;

margin-bottom:14px;

border-radius:8px;

border:1px solid rgba(244,239,230,0.15);

background:rgba(0,0,0,0.2);

color:#faf6ee;

font-size:14px;

}

input::placeholder{
color:#7f91ad;
}

input:focus{

outline:none;
border:1px solid #f4efe6;

box-shadow:0 0 8px rgba(244,239,230,0.4);

}

button{

width:100%;
padding:14px;

border:none;
border-radius:8px;

background:#f4efe6;

color:#0b1e3d;

font-weight:600;

cursor:pointer;

transition:all 0.25s ease;

margin-top:6px;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 12px 30px rgba(244,239,230,0.4);

}

.divider{

margin:22px 0;
text-align:center;
font-size:12px;

color:#9fb0c7;

}

.sso{

display:flex;
gap:10px;

}

.sso button{

background:transparent;

border:1px solid rgba(244,239,230,0.2);

color:#f4efe6;

font-size:13px;

}

.sso button:hover{

background:rgba(244,239,230,0.08);

}

.login-link{

margin-top:20px;
text-align:center;
font-size:13px;
color:#9fb0c7;

}

.login-link a{

color:#f4efe6;
text-decoration:none;

}

.login-link a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="logo">qala</div>

<div class="tagline">
Solution Factory Operating System
</div>

<div class="info">

<div>Create and manage Solution Factories</div>
<div>Provision Secure Development Environments</div>
<div>Deploy CI/CD Factory Pipelines</div>
<div>Manage Distributed Solution Registries</div>
<div>AI-Assisted Development Workflows</div>

</div>

</div>

<div class="right">

<div class="register-box">

<div class="register-title">Create Factory Account</div>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email Address">

<input type="text" placeholder="Organization / Factory Name">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<button>Create Account</button>

<div class="divider">OR REGISTER WITH</div>

<div class="sso">

<button>GitHub</button>
<button>Google</button>
<button>SSO</button>

</div>

<div class="login-link">

Already have a factory account?  
<a href="qala-login.html">Login</a>

</div>

</div>

</div>

</div>

</body>
</html>
