<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>qala — Factory Setup</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Inter",sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(140deg,#07152c,#0b1e3d,#030b18);
color:white;
overflow:hidden;
}

/* animated grid */

body:before{
content:"";
position:absolute;
width:200%;
height:200%;

background-image:
linear-gradient(rgba(244,239,230,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(244,239,230,0.05) 1px, transparent 1px);

background-size:70px 70px;
animation:gridmove 25s linear infinite;
}

@keyframes gridmove{
0%{transform:translate(0,0)}
100%{transform:translate(-70px,-70px)}
}

.container{

width:1150px;
height:660px;

display:flex;

background:rgba(255,255,255,0.03);

border-radius:20px;

backdrop-filter:blur(20px);

box-shadow:0 40px 120px rgba(0,0,0,0.7);

border:1px solid rgba(244,239,230,0.08);

overflow:hidden;
z-index:2;

}

/* left guide panel */

.left{

flex:1.1;

padding:70px;

display:flex;
flex-direction:column;
justify-content:center;

background:linear-gradient(160deg,#0b1e3d,#050f22);

}

.logo{

font-size:44px;
font-weight:700;
letter-spacing:2px;

color:#faf6ee;

margin-bottom:10px;

}

.tagline{

color:#b7c3d6;
margin-bottom:40px;
font-size:15px;

}

.steps{

font-size:14px;
line-height:32px;
color:#dbe3f3;

}

.steps div{

padding-left:12px;
border-left:3px solid rgba(244,239,230,0.35);
margin-bottom:10px;

}

/* right setup form */

.right{

flex:1;

display:flex;
align-items:center;
justify-content:center;

background:rgba(255,255,255,0.02);

}

.setup-box{

width:420px;

}

.title{

font-size:24px;
font-weight:600;
margin-bottom:20px;

color:#faf6ee;

}

.subtitle{

font-size:13px;
color:#9fb0c7;
margin-bottom:25px;

}

/* inputs */

input, select{

width:100%;
padding:14px;

margin-bottom:14px;

border-radius:8px;

border:1px solid rgba(244,239,230,0.15);

background:rgba(0,0,0,0.2);

color:#faf6ee;

font-size:14px;

}

input::placeholder{
color:#7f91ad;
}

input:focus, select:focus{

outline:none;
border:1px solid #f4efe6;

box-shadow:0 0 8px rgba(244,239,230,0.4);

}

/* button */

button{

width:100%;
padding:14px;

border:none;
border-radius:8px;

background:#f4efe6;

color:#0b1e3d;

font-weight:600;

cursor:pointer;

transition:all 0.25s ease;

margin-top:10px;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 12px 30px rgba(244,239,230,0.4);

}

.progress{

margin-bottom:25px;

height:6px;
background:rgba(255,255,255,0.08);
border-radius:10px;

overflow:hidden;

}

.progress-bar{

height:100%;
width:35%;
background:#f4efe6;

}

.footer{

margin-top:15px;

font-size:12px;
color:#7f91ad;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="logo">qala</div>

<div class="tagline">
Solution Factory Operating System
</div>

<div class="steps">

<div>Step 1 — Configure Organization</div>
<div>Step 2 — Create First Factory</div>
<div>Step 3 — Provision Dev Environment</div>
<div>Step 4 — Deploy First Solution</div>

</div>

</div>

<div class="right">

<div class="setup-box">

<div class="title">Initialize Your Factory</div>

<div class="subtitle">
Let's configure your first solution factory environment.
</div>

<div class="progress">
<div class="progress-bar"></div>
</div>

<input type="text" placeholder="Organization Name">

<input type="text" placeholder="Factory Name">

<select>
<option>Select Primary Development Stack</option>
<option>JavaScript / Node</option>
<option>Python</option>
<option>Java</option>
<option>Go</option>
<option>Multi-language</option>
</select>

<input type="text" placeholder="Default Workspace Name">

<button>Initialize Factory</button>

<div class="footer">
qala SFOS · Factory Initialization
</div>

</div>

</div>

</div>

</body>
</html>
