<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">Q</div>
      <div class="logo-name">qala</div>
    </div>

    <div class="factory-select">
      <div class="factory-info">
        <div class="factory-label">Active Factory</div>
        <div class="factory-name">Acme Engineering</div>
      </div>
      <span class="factory-tier">TEAM</span>
    </div>

    <nav class="nav">
      <div class="nav-system" *ngFor="let system of navSystems">
        <a
          class="nav-system-title"
          [routerLink]="system.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <span class="ico">{{ system.icon }}</span>
          {{ system.label }}
        </a>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="avatar">AJ</div>
      <div class="user-info">
        <div class="user-name">Alex Jordan</div>
        <div class="user-role">Factory Admin</div>
      </div>
    </div>
  </aside>

  <div class="content-shell">
    <div class="subnav" *ngIf="activeSystem$ | async as activeSystem">
      <div class="subnav-left">
        <div class="subnav-title">{{ activeSystem.label }}</div>
        <div class="subnav-links" *ngIf="activeSystem.children.length">
          <a
            *ngFor="let item of activeSystem.children"
            class="subnav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
          >
            {{ item.label }}
          </a>
        </div>
      </div>
      <a class="subnav-signout" routerLink="/home">Sign out</a>
    </div>
    <div class="content-scroll">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
